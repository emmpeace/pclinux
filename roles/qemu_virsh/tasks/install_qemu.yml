---
# necessary packages for virtualization

- name: Install necessary packages for virtualization
  apt:
    name: "{{ item }}"
    state: present
  with_items:
    - "qemu-kvm"
    - "virt-manager"
    - "libvirt-daemon-system"
    - "libvirt-clients"
    - "virtinst"
    - "libosinfo-bin"
    - "genisoimage"
    - "cpu-checker"
    - "guestfs-tools"
    - "cloud-image-utils"
    - "bridge-utils"
    - "python3-lxml"
    - "python3-libvirt"
